name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CAITATION_SETUP_ONLY: "1"  # start scripts set everything up, then exit
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The same first-start setup colleagues get: no preinstalled Python needed.
      - name: Setup via start.bat
        if: runner.os == 'Windows'
        shell: cmd
        run: start.bat
      - name: Setup via start.command
        if: runner.os != 'Windows'
        run: ./start.command
      - name: Python of the app environment
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe
          echo "PY=$py" >> "$GITHUB_ENV"
      - run: .tools/uv pip install --python .venv -r requirements-dev.txt
      - run: $PY -m pytest -q
      - name: Plugin package builds
        run: $PY plugin/build.py
      - name: Frontend has no syntax errors
        if: runner.os == 'Linux'
        run: node --check frontend/app.js && node --check plugin/src/caitation.js
      - name: Windows installer builds
        if: runner.os == 'Windows'
        run: |
          version=$(python -c "import json; print(json.load(open('plugin/src/manifest.json'))['version'])")
          iscc=$(command -v iscc || true)
          [ -n "$iscc" ] || [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
          [ -n "$iscc" ] || iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" //Qp //DAppVersion=$version installer/caitation.iss
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/Caitation-Setup-*.exe
          retention-days: 7
